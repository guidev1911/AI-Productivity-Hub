spring:
  application:
    name: ai-productivity

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    mcp:
      server:
        protocol: STREAMABLE

server:
  port: 8080

logging:
  level:
    org.springframework.ai: DEBUG